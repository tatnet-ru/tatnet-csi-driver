name: build-and-push-image

# Собирает образ CSI-драйвера и пушит в GHCR на каждый тег (v*) и на main.
# Кластеры тянут образ через региональный pull-through кэш на v111
# (`K8S_REGISTRY_MIRRORS`, ghcr.io → зеркало региона). Кэш ходит в ghcr
# АНОНИМНО — ни логина, ни пароля в его конфиге нет, — поэтому пакет обязан
# быть публичным, иначе апстрим отдаёт 404 и поды встают в ImagePullBackOff
# (прецедент: пакет CCM публичный ровно по этой причине).
#
# Сборка по тегу публикует версию БЕЗ префикса `v` (metadata-action
# `{{version}}`): тег v0.1.0 → образ :0.1.0 — именно так его и пинит
# оркестратор, как и CCM (:0.2.0).
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
